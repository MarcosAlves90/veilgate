[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veilgate-local"
version = "0.1.0"
description = "Local-only fail-closed PII filter for OpenAI-compatible LLM requests"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "VeilGate contributors"}]
dependencies = []

[project.scripts]
veilgate = "veilgate.server:main"

[tool.setuptools.packages.find]
where = ["src"]
