name: Bug report
description: Report a reproducible problem using only synthetic data
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include secrets, personal data, or private prompts. For vulnerabilities, read SECURITY.md and contact the maintainer privately."
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0 / git SHA"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use synthetic data and describe the relevant request format.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
